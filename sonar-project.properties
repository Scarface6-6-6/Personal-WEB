sonar.projectKey=personal-web
sonar.projectName=Personal Web
sonar.projectVersion=1.0.0
sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.exclusions=.git/**,.github/**,README.md,node_modules/**,dist/**,src/tests/**
sonar.tests=src/tests
sonar.test.inclusions=src/tests/**/*.test.js,src/tests/**/*.test.jsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/*.test.jsx,src/tests/**,src/data/**
sonar.javascript.file.suffixes=.js,.jsx
sonar.security.hotspots.review.priority=HIGH
sonar.cpd.exclusions=src/tests/**,**/*.test.js,**/*.test.jsx,src/data/**,src/types/**,src/locales/**,src/**/*.css
