sonar.projectKey=personal-web
sonar.projectName=Personal Web
sonar.projectVersion=1.0.0
sonar.sources=JavaScript
sonar.sourceEncoding=UTF-8
sonar.exclusions=.git/**,.github/**,README.md,node_modules/**,dist/**,*.test.js,tests/**
sonar.tests=tests
sonar.test.inclusions=**/*.test.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,tests/**,JavaScript/data/**
sonar.javascript.file.suffixes=.js
sonar.security.hotspots.review.priority=HIGH
sonar.cpd.exclusions=tests/**,**/*.test.js
