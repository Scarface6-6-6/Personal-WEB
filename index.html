<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi espacio personal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Styles/styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main class="shell">
      <aside class="sidebar" aria-label="Menu principal">
        <section class="profile">
          <div class="avatar" aria-hidden="true"><img src="Images/profile.jpeg" /></div>
          <div>
            <p class="eyebrow">Profile</p>
            <h1>Scarface_666</h1>
            <p class="profile-text">Un espacio personal para contar lo que soy, lo que me gusta y lo que voy descubriendo.</p>
          </div>
        </section>

        <nav class="menu" aria-label="Pantallas" data-menu></nav>

        <footer class="sidebar-footer">
          <span class="status-dot"></span>
          <span>Editando poco a poco</span>
        </footer>
      </aside>

      <section class="content" aria-live="polite" data-screens></section>
    </main>

    <script type="module" src="JavaScript/script.js"></script>
  </body>
</html>
