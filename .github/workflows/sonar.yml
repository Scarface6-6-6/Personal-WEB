name: Sonar Analysis

on:
  push:
    branches:
      - main
      - Feature/Develop
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sonar:
    name: Analyze code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Validate Sonar configuration
        run: |
          if [ -z "${{ vars.SONAR_PROJECT_KEY }}" ]; then
            echo "SONAR_PROJECT_KEY repository variable is missing."
            exit 1
          fi

          if [ -z "${{ vars.SONAR_ORGANIZATION }}" ]; then
            echo "SONAR_ORGANIZATION repository variable is missing."
            exit 1
          fi

          echo "Using Sonar project key: ${{ vars.SONAR_PROJECT_KEY }}"
          echo "Using Sonar organization: ${{ vars.SONAR_ORGANIZATION }}"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
